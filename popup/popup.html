<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>NGA Spoiler Guard</title>
  <style>
    body {
      margin: 0;
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #10141a;
      color: #f2f2f2;
    }
    #app {
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 2px;
    }
    .nga-status {
      font-size: 12px;
      color: #8b93a1;
      margin: 0 0 14px;
    }
    .nga-current {
      font-size: 13px;
      background: #1c222b;
      border: 1px solid #3a4250;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .nga-current strong {
      display: block;
      margin-bottom: 2px;
    }
    button.nga-choice {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #3a4250;
      background: #1c222b;
      color: #f2f2f2;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    button.nga-choice:hover {
      border-color: #e10600;
    }
    .nga-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .nga-row button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3a4250;
      background: none;
      color: #b7bec9;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">Chargement…</div>
  <script src="../src/storage.js"></script>
  <script src="../src/weekend.js"></script>
  <script src="popup.js"></script>
</body>
</html>
